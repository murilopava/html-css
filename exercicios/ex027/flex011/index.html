<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: salmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            flex-basis: 200px;   
        }

        /* Flex: GROW SHRING BASIS*/

        div#cxA {
            /*flex: 0 1 auto;*/
            flex: initial;
        }

        div#cxB {
            /* flex: 0 0 auto; */
            flex: none;
        }

        div#cxC {
            /* flex: 1 1 auto; */
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    
    </div>
</body>
</html>
