<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: salmon;

            display: flex;
            flex-flow: row wrap;
            align-items: auto;
        }

        div.item {
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Mais conteúdo</div>
        <div class="item">C</div>
        <div class="item">Muito mais conteúdo mais</div>
        <div class="item">E</div>
        <div class="item">Um conteúdo ainda maior que os outros</div>
        <div class="item">G</div>
    </div>
</body>
</html>
